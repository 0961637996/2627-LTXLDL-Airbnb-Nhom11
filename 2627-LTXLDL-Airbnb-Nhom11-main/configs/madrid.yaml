city: madrid
data_root: spain/comunidad-de-madrid/madrid
currency: EUR
snapshots:
  - "2025-09-14"
  - "2025-12-14"
  - "2026-03-24"
  - "2026-06-20"

# Dùng cho qa.py
qa:
  min_price: 1
  max_price: 805
  expected_area_range: [120, 130]
  valid_areas:
    - "A01"
    - "A02"
    - "A03"
    - "A04"
    - "A05"
    - "A06"
    - "A07"
    - "A08"
  valid_room_types:
    - "Entire home/apt"
    - "Private room"
    - "Shared room"
    - "Hotel room"
  automated_patterns:
    - "this is an automated posting"
    - "the host canceled this reservation"
    - "the reservation was canceled"

# Dùng cho kpi.py (và một phần cho viz.py)
kpi:
  area_cols:
    - "analysis_area"
    - "neighbourhood_cleansed"
  area_col: "neighbourhood_cleansed"   # phải khớp tên trong geojson để vẽ bản đồ
  min_n: 30
  host_threshold: 5
  commercial_nights: 183
  # Chỉ tính K2/K3 trên 90 ngày đầu sau mỗi mốc để các mốc so sánh công bằng
  # (365 ngày làm các đêm xa, chưa ai đặt, kéo tỷ lệ xuống và khó so sánh).
  occupancy_days: 90
  # Bật K8 (số đăng ký). Madrid có chế độ đăng ký nên cột license có ý nghĩa.
  use_license: true

# Dùng cho viz.py
viz:
  dpi: 200
  top_n: 12
  min_coverage: 0.5
  k6_threshold: null   # đặt số (vd 15) nếu muốn vẽ vạch ngưỡng cảnh báo K6