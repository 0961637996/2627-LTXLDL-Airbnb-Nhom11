city: madrid
data_root: spain/comunidad-de-madrid/madrid  
currency: EUR
snapshots: [2025-09-14, 2025-12-14, 2026-03-24, 2026-06-20]


# Các tham số dùng cho bước làm sạch (qa.py)
qa_params:
  min_price: 1           # Mức giá tối thiểu hợp lệ (loại bỏ giá <= 0)
  max_price: 50000       # Mức giá tối đa (loại bỏ dữ liệu rác/giá ảo)
  valid_room_types:
    - "Entire home/apt"
    - "Private room"
    - "Shared room"
    - "Hotel room"

# Các tham số dùng cho bước đánh giá LLM (llm.py, evaluate.py)
llm_params:
  model_name: "gemini-1.5-flash"
  temperature: 0.1
  max_retries: 3